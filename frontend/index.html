<!DOCTYPE html>
<html lang="mr" dir="ltr" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>महासेवा AI | महाराष्ट्र शासन नागरिक सेवा गेटवे</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            maha: {
              navy: '#0F2942',
              blue: '#1E40AF',
              saffron: '#E65100',
              saffronLight: '#FF9800',
              emerald: '#059669',
              gold: '#D97706',
              dark: '#0A192F',
              card: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans"', '"Noto Sans Devanagari"', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800&family=Noto+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- MahaSeva I18n Engine Script -->
  <script src="js/i18n.js"></script>

  <style>
    body {
      font-family: 'Noto Sans Devanagari', 'Noto Sans', system-ui, sans-serif;
    }
    .tricolor-stripe {
      background: linear-gradient(90deg, #FF9933 0%, #FF9933 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #138808 66.66%, #138808 100%);
      height: 4px;
    }
    .chat-bubble-user {
      background: linear-gradient(135deg, #1E40AF 0%, #1D4ED8 100%);
    }
    .chat-bubble-ai {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;

</head>
<body class="min-h-full flex flex-col text-slate-800 antialiased selection:bg-orange-100 selection:text-orange-900">

  <!-- Top Tricolor Accent Bar -->
  <div class="tricolor-stripe"></div>

  <!-- Dynamic Header -->
  <header id="main-header" class="sticky top-0 z-50"></header>

  <!-- Dynamic Content Container -->
  <main id="app-container" class="flex-grow"></main>

  <!-- Universal Footer -->
  <footer id="main-footer" class="bg-slate-900 text-slate-400 text-xs border-t border-slate-800 mt-16"></footer>

  <!-- Notification Toast Box -->
  <div id="toast-box" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 max-w-sm pointer-events-none"></div>

  <!-- Application Logic -->
  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:8000/api/v1' 
      : `${window.location.origin}/api/v1`;

    let currentView = 'home';
    let chatHistory = [];

    function initChatHistory() {
      chatHistory = [
        {
          sender: 'ai',
          text: t('assistant.welcome_msg'),
          citations: [t('services.heading'), 'Aaple Sarkar Portal']
        }
      ];
    }

    function toggleMobileMenu() {
      const el = document.getElementById('mobile-menu');
      if (el) el.classList.toggle('hidden');
    }

    function showToast(title, message, type = 'success') {
      const box = document.getElementById('toast-box');
      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-blue-600');
      toast.className = `${bg} text-white px-4 py-3 rounded-lg shadow-xl text-xs flex items-start space-x-2 transition-all transform duration-300 pointer-events-auto`;
      toast.innerHTML = `
        <div class="font-bold flex-1">
          <div>${title}</div>
          <div class="text-[11px] font-normal text-white/90 mt-0.5">${message}</div>
        </div>
      `;
      box.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function navigate(view) {
      currentView = view;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      renderCurrentView();
    }

    // Helper formatting functions
    function formatMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n\n/g, '<br/><br/>')
        .replace(/\n•/g, '<br/>•')
        .replace(/\n/g, '<br/>');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Main Renderer
    async function renderCurrentView() {
      renderHeader();
      renderFooter();

      const container = document.getElementById('app-container');
      if (currentView === 'home') {
        container.innerHTML = renderHomeView();
      } else if (currentView === 'assistant') {
        container.innerHTML = renderAssistantView();
        setupAssistantEvents();
      } else if (currentView === 'eligibility') {
        container.innerHTML = renderEligibilityView();
      } else if (currentView === 'schemes') {
        container.innerHTML = `<div class="text-center py-20"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div></div>`;
        container.innerHTML = await renderSchemesView();
      } else if (currentView === 'services') {
        container.innerHTML = `<div class="text-center py-20"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div></div>`;
        container.innerHTML = await renderServicesView();
      } else if (currentView === 'grievance') {
        container.innerHTML = renderGrievanceView();
      } else if (currentView === 'directory') {
        container.innerHTML = `<div class="text-center py-20"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div></div>`;
        container.innerHTML = await renderDirectoryView();
      } else if (currentView === 'admin') {
        container.innerHTML = `<div class="text-center py-20"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div></div>`;
        container.innerHTML = await renderAdminView();
      } else if (currentView === 'translations') {
        container.innerHTML = `<div class="text-center py-20"><div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent"></div></div>`;
        container.innerHTML = await renderTranslationsView();
      }

      MahaI18n.updateDocumentAttributes();
      lucide.createIcons();
    }

    function renderHeader() {
      const header = document.getElementById('main-header');
      const lang = MahaI18n.currentLanguage;
      
      header.innerHTML = `
        <!-- Prototype Advisory Banner -->
        <aside aria-label="Prototype Notice" class="bg-amber-500 text-slate-950 text-xs font-semibold px-4 py-1.5 flex items-center justify-between shadow-sm">
          <div class="max-w-7xl mx-auto w-full flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="bg-slate-900 text-white text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider">${t('app.prototype_badge')}</span>
              <span>${t('app.prototype_notice')}</span>
            </div>
            <div class="hidden md:flex items-center space-x-3 text-[11px]">
              <span>${t('app.rts_badge')}</span>
              <span>•</span>
              <span>${t('app.zero_hallucination')}</span>
            </div>
          </div>
        </aside>

        <!-- Main Nav -->
        <div class="bg-maha-navy text-white shadow-md">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
              
              <!-- Logo & Brand -->
              <div class="flex items-center space-x-3 cursor-pointer" onclick="navigate('home')">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-white font-black text-2xl shadow-lg border border-amber-300/30">
                  म
                </div>
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="text-xl font-bold tracking-tight text-white">MahaSeva <span class="text-amber-400">AI</span></span>
                    <span class="text-xs bg-blue-900/80 text-blue-200 px-2 py-0.5 rounded border border-blue-700 font-bold">${t('app.title')}</span>
                  </div>
                  <p class="text-[11px] text-slate-300 font-normal">${t('app.tagline')}</p>
                </div>
              </div>

              <!-- Nav Links -->
              <nav class="hidden lg:flex items-center space-x-1 font-medium text-xs sm:text-sm">
                <button onclick="navigate('home')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'home' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition">${t('nav.home')}</button>
                <button onclick="navigate('assistant')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'assistant' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition flex items-center space-x-1.5">
                  <i data-lucide="bot" class="w-4 h-4 text-amber-400"></i>
                  <span>${t('nav.assistant')}</span>
                </button>
                <button onclick="navigate('eligibility')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'eligibility' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition flex items-center space-x-1">
                  <i data-lucide="calculator" class="w-4 h-4 text-emerald-400"></i>
                  <span>${t('nav.eligibility')}</span>
                </button>
                <button onclick="navigate('schemes')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'schemes' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition">${t('nav.schemes')}</button>
                <button onclick="navigate('services')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'services' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition">${t('nav.services')}</button>
                <button onclick="navigate('grievance')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'grievance' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition">${t('nav.grievance')}</button>
                <button onclick="navigate('directory')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'directory' ? 'bg-white/20 text-white font-bold' : 'text-slate-200 hover:text-white hover:bg-white/10'} transition">${t('nav.directory')}</button>
                <button onclick="navigate('admin')" class="nav-btn px-3 py-2 rounded-lg ${currentView === 'admin' ? 'bg-amber-500/30 text-amber-300 font-bold' : 'text-amber-300 hover:bg-amber-500/20'} transition flex items-center space-x-1">
                  <i data-lucide="shield-alert" class="w-4 h-4"></i>
                  <span>${t('nav.officer')}</span>
                </button>
              </nav>

              <!-- Language Selector -->
              <div class="flex items-center space-x-3">
                <div class="inline-flex rounded-lg bg-slate-800 p-1 border border-slate-700 text-xs" role="group" aria-label="Language Selector">
                  <button onclick="setLanguage('mr')" id="lang-mr" class="px-2.5 py-1 rounded transition ${lang === 'mr' ? 'font-bold bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white font-medium'}">मराठी</button>
                  <button onclick="setLanguage('hi')" id="lang-hi" class="px-2.5 py-1 rounded transition ${lang === 'hi' ? 'font-bold bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white font-medium'}">हिंदी</button>
                  <button onclick="setLanguage('en')" id="lang-en" class="px-2.5 py-1 rounded transition ${lang === 'en' ? 'font-bold bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white font-medium'}">English</button>
                </div>

                <button onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-lg bg-slate-800 text-white" aria-label="Toggle Navigation">
                  <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
              </div>

            </div>
          </div>

          <!-- Mobile Dropdown -->
          <div id="mobile-menu" class="hidden lg:hidden bg-slate-900 border-t border-slate-800 px-4 py-3 space-y-2 text-sm">
            <button onclick="navigate('home'); toggleMobileMenu()" class="block w-full text-left py-2 text-slate-200 font-medium">${t('nav.home')}</button>
            <button onclick="navigate('assistant'); toggleMobileMenu()" class="block w-full text-left py-2 text-amber-400 font-medium">${t('nav.assistant')}</button>
            <button onclick="navigate('eligibility'); toggleMobileMenu()" class="block w-full text-left py-2 text-emerald-400 font-medium">${t('nav.eligibility')}</button>
            <button onclick="navigate('schemes'); toggleMobileMenu()" class="block w-full text-left py-2 text-slate-200 font-medium">${t('nav.schemes')}</button>
            <button onclick="navigate('services'); toggleMobileMenu()" class="block w-full text-left py-2 text-slate-200 font-medium">${t('nav.services')}</button>
            <button onclick="navigate('grievance'); toggleMobileMenu()" class="block w-full text-left py-2 text-slate-200 font-medium">${t('nav.grievance')}</button>
            <button onclick="navigate('directory'); toggleMobileMenu()" class="block w-full text-left py-2 text-slate-200 font-medium">${t('nav.directory')}</button>
            <button onclick="navigate('admin'); toggleMobileMenu()" class="block w-full text-left py-2 text-amber-300 font-medium">${t('nav.officer')}</button>
            <button onclick="navigate('translations'); toggleMobileMenu()" class="block w-full text-left py-2 text-blue-300 font-medium">${t('nav.admin_translations')}</button>
          </div>
        </div>
      `;
    }

    function renderFooter() {
      const footer = document.getElementById('main-footer');
      footer.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
            <div>
              <div class="flex items-center space-x-2 text-white font-bold text-base mb-3">
                <span class="w-6 h-6 rounded bg-amber-500 text-slate-950 flex items-center justify-center font-black text-xs">म</span>
                <span>${t('app.title')}</span>
              </div>
              <p class="text-slate-400 text-xs leading-relaxed mb-4">
                ${t('footer.tagline')}
              </p>
              <div class="flex items-center space-x-2 text-[11px] text-amber-400 font-medium">
                <i data-lucide="shield-check" class="w-4 h-4"></i>
                <span>${t('app.zero_hallucination')}</span>
              </div>
            </div>

            <div>
              <h4 class="text-white font-semibold text-sm mb-3">${t('footer.important_links')}</h4>
              <ul class="space-y-2 text-xs">
                <li><a href="https://aaplesarkar.mahaonline.gov.in" target="_blank" class="hover:text-amber-400 transition flex items-center space-x-1"><span>Aaple Sarkar (आपले सरकार)</span> <i data-lucide="external-link" class="w-3 h-3"></i></a></li>
                <li><a href="https://mahadbt.maharashtra.gov.in" target="_blank" class="hover:text-amber-400 transition flex items-center space-x-1"><span>MahaDBT (महाडीबीटी)</span> <i data-lucide="external-link" class="w-3 h-3"></i></a></li>

            </div>

            <div>
              <h4 class="text-white font-semibold text-sm mb-3">${t('footer.rts_act_heading')}</h4>
              <p class="text-slate-400 text-xs leading-relaxed mb-3">
                ${t('footer.rts_act_desc')}
              </p>
              <button onclick="navigate('translations')" class="mt-2 text-[11px] text-amber-400 hover:underline flex items-center space-x-1">
                <i data-lucide="languages" class="w-3.5 h-3.5"></i>
                <span>${t('nav.admin_translations')}</span>
              </button>
            </div>
          </div>

          <div class="border-t border-slate-800 pt-6 flex flex-col sm:flex-row items-center justify-between text-slate-500 text-[11px]">
            <p>${t('footer.copyright')}</p>

    // ==========================================
    // 1. HOME VIEW
    // ==========================================
    function renderHomeView() {
      return `
        <!-- Hero Section -->
        <section class="bg-gradient-to-b from-maha-navy via-slate-900 to-slate-950 text-white pt-12 pb-20 px-4 relative overflow-hidden">
          <div class="max-w-6xl mx-auto text-center relative z-10">
            
            <div class="inline-flex items-center space-x-2 bg-white/10 backdrop-blur-md px-3.5 py-1.5 rounded-full text-xs text-amber-300 font-semibold mb-6 border border-white/10">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>${t('hero.badge')}</span>
            </div>

            <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4 leading-tight">
              ${t('hero.title_p1')} <br class="hidden sm:inline"/>

              <button onclick="executeHeroSearch()" class="bg-gradient-to-r from-amber-500 to-orange-600 text-white font-bold text-xs sm:text-sm px-6 py-3 rounded-xl hover:from-amber-600 hover:to-orange-700 transition shadow flex items-center space-x-1.5 whitespace-nowrap">
                <span>${t('hero.search_button')}</span>

              <button onclick="quickAsk('${t('hero.chip_shetkari')}')" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full border border-white/10 transition">${t('hero.chip_shetkari')}</button>
              <button onclick="quickAsk('${t('hero.chip_income')}')" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full border border-white/10 transition">${t('hero.chip_income')}</button>
              <button onclick="quickAsk('${t('hero.chip_satbara')}')" class="bg-white/10 hover:bg-white/20 px-3 py-1 rounded-full border border-white/10 transition">${t('hero.chip_satbara')}</button>

          </div>
        </section>

        <!-- Stats Strip -->
        <div class="max-w-6xl mx-auto px-4 -mt-10 relative z-20">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 flex items-center space-x-4">
              <div class="w-12 h-12 rounded-xl bg-orange-100 text-orange-600 flex items-center justify-center font-bold">
                <i data-lucide="landmark" class="w-6 h-6"></i>
              </div>
              <div>
                <div class="text-2xl font-black text-slate-900">${t('stats.schemes_count')}</div>

              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 flex items-center space-x-4">
              <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold">
                <i data-lucide="clock" class="w-6 h-6"></i>
              </div>
              <div>
                <div class="text-2xl font-black text-slate-900">${t('stats.rts_count')}</div>
                <div class="text-xs text-slate-500 font-medium">${t('stats.rts_sub')}</div>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-lg border border-slate-100 flex items-center space-x-4">
              <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
                <i data-lucide="languages" class="w-6 h-6"></i>
              </div>
              <div>
                <div class="text-2xl font-black text-slate-900">${t('stats.languages_count')}</div>
                <div class="text-xs text-slate-500 font-medium">${t('stats.languages_sub')}</div>

    function renderChatMessage(msg) {
      if (msg.sender === 'user') {
        return `
          <div class="flex justify-end">
            <div class="chat-bubble-user text-white px-5 py-3.5 rounded-2xl rounded-tr-none text-sm max-w-lg shadow font-medium leading-relaxed">
              ${escapeHtml(msg.text)}
            </div>
          </div>
        `;
      } else {
        return `
          <div class="flex justify-start items-start space-x-3">
            <div class="w-8 h-8 rounded-full bg-maha-navy text-amber-400 flex items-center justify-center font-bold text-xs flex-shrink-0 mt-1 shadow">
              म
            </div>
            <div class="chat-bubble-ai text-slate-800 px-5 py-4 rounded-2xl rounded-tl-none text-sm max-w-2xl shadow-sm leading-relaxed">
              <div class="prose prose-sm">${formatMarkdown(msg.text)}</div>
              
              ${msg.citations && msg.citations.length > 0 ? `
                <div class="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-1.5 text-[11px] text-slate-500">
                  <span class="font-semibold text-slate-700">${t('assistant.citations_label')}</span>
                  ${msg.citations.map(c => `<span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-mono border border-slate-200">${c}</span>`).join('')}
                </div>
              ` : ''}

              <div class="mt-2 text-[10px] text-slate-400 font-normal">
                ${t('assistant.disclaimer_text')}
              </div>
            </div>
          </div>
        `;
      }
    }

    function setupAssistantEvents() {
      const msgs = document.getElementById('chat-messages');
      if (msgs) msgs.scrollTop = msgs.scrollHeight;
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const q = input.value.trim();
      if (!q) return;

      input.value = '';
      chatHistory.push({ sender: 'user', text: q });
      
      const msgs = document.getElementById('chat-messages');
      msgs.innerHTML = chatHistory.map(msg => renderChatMessage(msg)).join('');
      msgs.scrollTop = msgs.scrollHeight;

      const loadingBubble = document.createElement('div');
      loadingBubble.id = 'loading-bubble';
      loadingBubble.className = 'flex justify-start items-center space-x-2 text-xs text-slate-500 pl-10';
      loadingBubble.innerHTML = `
        <div class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-amber-500 border-t-transparent"></div>
        <span>${t('assistant.searching')}</span>
      `;
      msgs.appendChild(loadingBubble);
      msgs.scrollTop = msgs.scrollHeight;

      try {
        const res = await fetch(`${API_BASE}/assistant/ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, language: MahaI18n.currentLanguage })
        });
        const data = await res.json();
        
        const lb = document.getElementById('loading-bubble');
        if (lb) lb.remove();

        chatHistory.push({
          sender: 'ai',
          text: data.answer,
          citations: data.source_citations || []
        });

        msgs.innerHTML = chatHistory.map(msg => renderChatMessage(msg)).join('');
        msgs.scrollTop = msgs.scrollHeight;
        lucide.createIcons();
      } catch (err) {
        const lb = document.getElementById('loading-bubble');
        if (lb) lb.remove();
        chatHistory.push({
          sender: 'ai',
          text: t('assistant.error_msg'),
          citations: []
        });
        msgs.innerHTML = chatHistory.map(msg => renderChatMessage(msg)).join('');
        msgs.scrollTop = msgs.scrollHeight;
      }
    }

    function askPrompt(p) {
      const inp = document.getElementById('chat-input');
      if (inp) {
        inp.value = p;
        sendChatMessage();
      }
    }

    function quickAsk(q) {
      chatHistory.push({ sender: 'user', text: q });
      navigate('assistant');
      setTimeout(() => {
        sendChatMessageDirect(q);
      }, 300);
    }

    async function sendChatMessageDirect(q) {
      try {
        const res = await fetch(`${API_BASE}/assistant/ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: q, language: MahaI18n.currentLanguage })
        });
        const data = await res.json();
        chatHistory.push({
          sender: 'ai',
          text: data.answer,
          citations: data.source_citations || []
        });
        renderCurrentView();
      } catch (e) {
        console.error(e);
      }
    }

    function executeHeroSearch() {
      const q = document.getElementById('hero-search-input').value.trim();
      if (q) quickAsk(q);
    }

        is_student: document.getElementById('elig-student').checked,
        has_disability: document.getElementById('elig-disability').checked

      const resBox = document.getElementById('eligibility-results');

        <div class="text-center py-8">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
          <p class="text-xs text-slate-500 mt-2">${t('eligibility.evaluating')}</p>

    function switchGrievanceTab(tType) {
      const filePanel = document.getElementById('grievance-file-panel');
      const trackPanel = document.getElementById('grievance-track-panel');
      const tabFile = document.getElementById('tab-file');
      const tabTrack = document.getElementById('tab-track');

      if (tType === 'file') {
        filePanel.classList.remove('hidden');
        trackPanel.classList.add('hidden');
        tabFile.className = "flex-1 py-2.5 rounded-xl bg-white text-slate-900 shadow";
        tabTrack.className = "flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900";
      } else {
        filePanel.classList.add('hidden');
        trackPanel.classList.remove('hidden');
        tabTrack.className = "flex-1 py-2.5 rounded-xl bg-white text-slate-900 shadow";
        tabFile.className = "flex-1 py-2.5 rounded-xl text-slate-600 hover:text-slate-900";
        trackGrievanceToken();
      }
    }

    async function submitGrievance(e) {
      e.preventDefault();
      const payload = {
        citizen_name: document.getElementById('grv-name').value,
        phone_number: document.getElementById('grv-phone').value,
        department_id: document.getElementById('grv-dept').value,
        district: document.getElementById('grv-district').value,
        category: "Citizen Service Delay",
        subject: document.getElementById('grv-subject').value,
        description: document.getElementById('grv-desc').value,
        preferred_language: MahaI18n.currentLanguage
      };

      try {
        const res = await fetch(`${API_BASE}/grievance/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const rec = await res.json();
        showToast(t('grievance.success_toast'), `${t('grievance.token_label')} ${rec.token_id}`, 'success');

        document.getElementById('track-token-input').value = rec.token_id;
        switchGrievanceTab('track');
      } catch (err) {
        showToast('Error', t('common.error'), 'error');
      }
    }

    async function trackGrievanceToken() {
      const token = document.getElementById('track-token-input').value.trim();
      const resBox = document.getElementById('track-result');
      if (!token) return;

      resBox.innerHTML = `<div class="text-center py-6"><div class="inline-block animate-spin rounded-full h-6 w-6 border-4 border-amber-500 border-t-transparent"></div></div>`;

      try {
        const res = await fetch(`${API_BASE}/grievance/track/${token}`);
        const data = await res.json();

        if (!data.found || !data.record) {
          resBox.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 text-xs rounded-xl">${data.message || 'Token not found.'}</div>`;
          return;
        }

        const r = data.record;
        resBox.innerHTML = `
          <div class="bg-slate-900 text-white p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <div class="text-xs text-amber-400 font-bold uppercase tracking-wider">${t('grievance.token_label')} ${r.token_id}</div>
              <div class="text-lg font-bold mt-0.5">${r.subject}</div>
              <div class="text-xs text-slate-300 mt-1">${r.department_name} • ${r.district} (${r.taluka})</div>
            </div>
            <div class="text-right">
              <span class="text-xs px-3 py-1 rounded-full font-bold bg-amber-500 text-slate-950">${r.current_status}</span>
              <div class="text-[11px] text-slate-400 mt-1">${t('grievance.sla_label')} ${r.sla_target_days} Days</div>
            </div>
          </div>

          <div>
            <h4 class="text-xs font-bold uppercase text-slate-700 tracking-wider mb-4">${t('grievance.audit_timeline')}</h4>
            <div class="space-y-4 pl-4 border-l-2 border-amber-400">
              ${r.timeline.map(ti => `
                <div class="relative pl-4">
                  <div class="absolute -left-[21px] top-1 w-3 h-3 rounded-full bg-amber-500 ring-4 ring-white"></div>
                  <div class="text-xs font-bold text-slate-900">${ti.stage} — <span class="text-slate-500 font-normal">${ti.timestamp}</span></div>
                  <div class="text-xs text-slate-600 mt-0.5 bg-slate-50 p-2 rounded-lg border border-slate-200">${ti.officer_remark}</div>
                  <div class="text-[10px] text-slate-400 mt-1">${t('grievance.officer_label')} ${ti.updated_by}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        lucide.createIcons();
      } catch (err) {
        resBox.innerHTML = `<div class="p-4 bg-rose-50 text-rose-700 text-xs rounded-xl">${t('common.error')}</div>`;
      }
    }

      try {
        const [sRes, gRes] = await Promise.all([
          fetch(`${API_BASE}/admin/dashboard-stats`),
          fetch(`${API_BASE}/grievance/list`)
        ]);
        stats = await sRes.json();
        grievances = await gRes.json();
      } catch (e) {
        console.error(e);
      }

      return `
        <div class="max-w-6xl mx-auto px-4 py-8">
          
          <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-lg mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <span class="text-xs bg-amber-400 text-slate-950 px-2 py-0.5 rounded font-bold uppercase">${t('admin.badge')}</span>
              <h2 class="text-2xl font-bold mt-1">${t('admin.heading')}</h2>
              <p class="text-xs text-slate-300">${t('admin.subheading')}</p>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="navigate('translations')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center space-x-1.5">
                <i data-lucide="languages" class="w-4 h-4"></i>
                <span>${t('nav.admin_translations')}</span>
              </button>
              <div class="text-xs bg-white/10 px-4 py-2 rounded-xl border border-white/10">
                <span class="text-emerald-400 font-bold">● ${stats.system_status || 'Online'}</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div class="text-xs text-slate-500 font-medium">${t('admin.total_schemes')}</div>
              <div class="text-2xl font-black text-slate-900 mt-1">${stats.total_schemes || 12}</div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div class="text-xs text-slate-500 font-medium">${t('admin.total_rts')}</div>
              <div class="text-2xl font-black text-slate-900 mt-1">${stats.total_services_rts || 8}</div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div class="text-xs text-slate-500 font-medium">${t('admin.total_grievances')}</div>
              <div class="text-2xl font-black text-amber-600 mt-1">${stats.grievances_total || grievances.length}</div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div class="text-xs text-slate-500 font-medium">${t('admin.compliance_rate')}</div>
              <div class="text-2xl font-black text-emerald-600 mt-1">${stats.rts_compliance_rate || '98.4%'}</div>
            </div>
          </div>

          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <h3 class="text-lg font-bold text-slate-900 mb-4">${t('admin.queue_heading')}</h3>
            
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-slate-200 text-slate-400 uppercase">
                    <th class="py-3 px-2">${t('admin.th_token')}</th>
                    <th class="py-3 px-2">${t('admin.th_citizen')}</th>
                    <th class="py-3 px-2">${t('admin.th_dept')}</th>
                    <th class="py-3 px-2">${t('admin.th_subject')}</th>
                    <th class="py-3 px-2">${t('admin.th_priority')}</th>
                    <th class="py-3 px-2">${t('admin.th_status')}</th>
                    <th class="py-3 px-2">${t('admin.th_action')}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${grievances.map(g => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-2 font-mono font-bold text-amber-700">${g.token_id}</td>
                      <td class="py-3 px-2 font-semibold text-slate-900">${g.citizen_name}<br/><span class="text-[10px] text-slate-400 font-normal">${g.phone_number}</span></td>
                      <td class="py-3 px-2">${g.department_name}<br/><span class="text-[10px] text-slate-400">${g.district}</span></td>
                      <td class="py-3 px-2 max-w-xs truncate">${g.subject}</td>
                      <td class="py-3 px-2">
                        <span class="px-2 py-0.5 rounded font-bold ${g.priority_level === 'Critical' ? 'bg-rose-100 text-rose-800' : (g.priority_level === 'High' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700')}">
                          ${g.priority_level}
                        </span>
                      </td>
                      <td class="py-3 px-2 font-bold text-slate-800">${g.current_status}</td>
                      <td class="py-3 px-2">
                        <button onclick="promptStatusUpdate('${g.token_id}')" class="bg-maha-navy hover:bg-amber-600 text-white px-2.5 py-1 rounded font-bold transition">
                          ${t('admin.btn_update')}
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      `;
    }

    // ==========================================
    // 9. ADMIN TRANSLATIONS CACHE VIEW
    // ==========================================
    async function renderTranslationsView() {
      let cacheData = { total: 0, entries: [] };
      try {
        const res = await fetch(`${API_BASE}/translation/cache`);
        if (res.ok) cacheData = await res.json();
      } catch (e) {
        console.error(e);
      }

      return `
        <div class="max-w-6xl mx-auto px-4 py-8">
          
          <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-lg mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <span class="text-xs bg-blue-400 text-slate-950 px-2 py-0.5 rounded font-bold uppercase">${t('nav.admin_translations')}</span>
              <h2 class="text-2xl font-bold mt-1">${t('translations.heading')}</h2>
              <p class="text-xs text-slate-300">${t('translations.subheading')}</p>
            </div>
            <div class="text-xs bg-white/10 px-4 py-2 rounded-xl border border-white/10">
              <span class="text-white font-bold">${t('translations.total_cached')} ${cacheData.total}</span>
            </div>
          </div>

          <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="border-b border-slate-200 text-slate-400 uppercase">
                    <th class="py-3 px-2">${t('translations.th_id')}</th>
                    <th class="py-3 px-2">${t('translations.th_source')}</th>
                    <th class="py-3 px-2">${t('translations.th_target')}</th>
                    <th class="py-3 px-2">${t('translations.th_text')}</th>
                    <th class="py-3 px-2">${t('translations.th_translated')}</th>
                    <th class="py-3 px-2">${t('translations.th_provider')}</th>
                    <th class="py-3 px-2">${t('translations.th_actions')}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${cacheData.entries.length > 0 ? cacheData.entries.map(e => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-3 px-2 font-mono font-bold text-blue-700">${e.id}</td>
                      <td class="py-3 px-2 uppercase font-bold text-slate-600">${e.source_language}</td>
                      <td class="py-3 px-2 uppercase font-bold text-amber-700">${e.target_language}</td>
                      <td class="py-3 px-2 max-w-xs truncate text-slate-700">${escapeHtml(e.source_text)}</td>
                      <td class="py-3 px-2 max-w-xs font-semibold text-slate-900">${escapeHtml(e.translated_text)}</td>
                      <td class="py-3 px-2">
                        <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded text-[10px] font-mono border border-slate-200">${e.provider}</span>
                      </td>
                      <td class="py-3 px-2 flex items-center space-x-1.5">
                        <button onclick="editTranslationEntry('${e.id}', '${escapeHtml(e.translated_text)}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded text-[11px] font-bold transition">
                          ${t('translations.btn_edit')}
                        </button>
                        <button onclick="deleteTranslationEntry('${e.id}')" class="bg-rose-600 hover:bg-rose-700 text-white px-2 py-1 rounded text-[11px] font-bold transition">
                          ${t('translations.btn_delete')}
                        </button>
                      </td>
                    </tr>
                  `).join('') : `
                    <tr>
                      <td colspan="7" class="py-8 text-center text-slate-400">
                        No dynamic translations in cache yet. Dynamic terms requested by users are automatically cached here.
                      </td>
                    </tr>
                  `}
                </tbody>
              </table>
            </div>
          </div>

        </div>
      `;
    }

    async function editTranslationEntry(id, currentText) {
      const newText = prompt(`Edit translation for ${id}:`, currentText);
      if (!newText || newText === currentText) return;

      try {
        const res = await fetch(`${API_BASE}/translation/cache/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ new_translation: newText })
        });
        if (res.ok) {
          showToast('Updated', 'Translation entry updated.', 'success');
          renderCurrentView();
        }
      } catch (e) {
        showToast('Error', 'Could not update translation', 'error');
      }
    }

    async function deleteTranslationEntry(id) {
      if (!confirm(`Are you sure you want to delete cache entry ${id}?`)) return;

      try {
        const res = await fetch(`${API_BASE}/translation/cache/${id}`, {
          method: 'DELETE'
        });
        if (res.ok) {
          showToast('Deleted', 'Translation entry removed.', 'success');
          renderCurrentView();
        }
      } catch (e) {
        showToast('Error', 'Could not delete entry', 'error');
      }
    }

    async function promptStatusUpdate(token) {
      const newStatus = prompt(`Select status:\n1. Assigned\n2. Under Investigation\n3. Action In Progress\n4. Resolved`, 'Resolved');
      if (!newStatus) return;
      const remark = prompt('Officer Remark:', 'Verification complete. Action taken under RTS Act standards.');
      if (!remark) return;

      try {
        await fetch(`${API_BASE}/grievance/update-status/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            new_status: newStatus,
            remark: remark,
            officer_name: "Desk Officer / Tahsildar"
          })
        });
        showToast('Updated', `Token ${token} updated.`, 'success');
        renderCurrentView();
      } catch (e) {
        showToast('Error', t('common.error'), 'error');
      }
    }

    // App Initialization
    window.addEventListener('DOMContentLoaded', async () => {
      await MahaI18n.init();
      initChatHistory();
      renderCurrentView();
    });
  </script>
</body>
</html>
